# Configuración del Agente "Hola Mundo"

# Definición de componentes del agente
a1.sources  = r1
a1.sinks    = k1
a1.channels = c1

# Configuración de propiedades del source
a1.sources.r1.type = netcat
a1.sources.r1.bind = localhost
a1.sources.r1.port = 44444

# Configuración de propiedades del canal
a1.channels.c1.type = memory
a1.channels.c1.capacity = 1000
a1.channels.c1.transactionCapacity = 100

# Configuración de porpiedades del sink
a1.sinks.k1.type = logger

# Vincular source y sink al canal creado
a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1
